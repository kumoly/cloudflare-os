name: CI

on:
  push:
    branches: ['cfos/**', 'feat/**', 'fix/**', 'chore/**', 'sync/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

# One push run per branch commit; superseded commits share a queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'cfos/main' && github.ref_name != 'main' }}

env:
  NODE_VERSION: "24.19.0"

jobs:
  privacy:
    name: CFOS privacy checks
    if: github.repository == 'kumoly/cloudflare-os' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch official upstream
        run: |
          git remote add upstream https://github.com/cloudflare/cloudflare-os.git
          git remote set-url --push upstream DISABLED
          git fetch --no-tags upstream main
      - name: Install pinned privacy scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/cfos-scanner"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/cfos-scanner" gitleaks
          echo "$RUNNER_TEMP/cfos-scanner" >> "$GITHUB_PATH"
      - name: Test publication, identity and filesystem guards
        run: node --test scripts/cfos.test.mjs scripts/cfos-local.test.mjs scripts/cfos-security.test.mjs
      - name: Verify downstream history and repository
        run: node scripts/cfos.mjs verify --publish --detached
      - name: Scan publication content and commit metadata
        run: node scripts/cfos-security.mjs

  # Parallel to `test` so lint and test failures surface on the same run. Package type checking
  # lives in Build; `scripts/` is checked here instead, because it is deliberately kept off
  # `pnpm build`'s hot path (see AGENTS.md) and this is the cheap job.
  lint:
    name: Lint
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ downloads its own pnpm for `vp install` and exposes no shim, so this is what puts
      # `pnpm` on PATH for the steps below.
      - name: Enable Corepack
        run: corepack enable

      # Vite+ resolves its own version from the `vite-plus` catalog entry, and installs the pnpm
      # named in `packageManager` (integrity hash checked as Corepack does), so setup-node is not
      # needed.
      #
      # No `cache` here, unlike `test`: this job is fast anyway, and both caching
      # means they race to reserve the same lockfile-keyed entry.
      # TODO(someday): It would be great if the setup-vp action could share a cache key with the test job but disable writes to cache
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: true

      - name: Lint
        run: pnpm lint:check

      - name: Type-check scripts/
        run: pnpm types:scripts

      - name: Check generated worker configs
        run: pnpm configs:check

  test:
    name: Build and test
    needs: privacy
    runs-on: ubuntu-latest
    # Install, build and test together take ~2.5 minutes. Without an explicit cap a wedged test
    # process (a spawned child that outlives its reap keeps `node --test` alive forever) burns the
    # 6-hour default instead of failing, on every run of the branch.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ downloads its own pnpm for `vp install` and exposes no shim, so this is what puts
      # `pnpm` on PATH for the steps below.
      - name: Enable Corepack
        run: corepack enable

      # Vite+ resolves its own version from the `vite-plus` catalog entry, and installs the pnpm
      # named in `packageManager` (integrity hash checked as Corepack does), so setup-node is not
      # needed.
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: true

      # Codegen, the frontend/SPA bundles, and the repo's single type check (`types:check` aliases this).
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
