name: CFOS checks

on:
  workflow_dispatch:

permissions:
  contents: read

# Optional manual runs share a queue per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'cfos/main' && github.ref_name != 'main' }}

jobs:
  downstream:
    name: CFOS branch and release checks
    if: github.repository == 'kumoly/cloudflare-os'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure read-only upstream
        run: |
          git remote add upstream https://github.com/cloudflare/cloudflare-os.git
          git remote set-url --push upstream DISABLED
      - name: Test branch and release guards
        run: node --test scripts/cfos.test.mjs scripts/cfos-local.test.mjs
      - name: Check downstream lineage and remotes
        run: node scripts/cfos.mjs verify --publish --detached
